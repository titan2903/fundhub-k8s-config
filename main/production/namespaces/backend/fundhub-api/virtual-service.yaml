apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: virtual-service-fundhub-be
spec:
  hosts:
    - "fundhub.api.local"
  http:
    - name: "customer-canary-deployment"
      route:
        - destination:
            host: fundhub.api.local
            subset: v1
          weight: 90
        - destination:
            host: fundhub.api.local
            subset: v2
          weight: 10