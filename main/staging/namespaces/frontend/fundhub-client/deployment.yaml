apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundhub-client-dev
spec:
  selector:
    matchLabels:
      app: fundhub-client-dev
  template:
    metadata:
      labels:
        app: fundhub-client-dev
    spec:
      containers:
        - name: fundhub-client-dev
          image: titan29/fundhub-client-dev:latest
          resources:
            limits:
              memory: "256Mi" # Adjust the memory limit based on your application's requirements
              cpu: "100m"
            requests:
              memory: "128Mi" # Adjust the memory request based on your application's requirements
              cpu: "10m"
          ports:
            - containerPort: 3010
