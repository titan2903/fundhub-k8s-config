apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundhub-client-dev
spec:
  selector:
    matchLabels:
      app: fundhub-client-dev
  template:
    metadata:
      labels:
        app: fundhub-client-dev
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: fundhub-client-dev
          image: titan29/fundhub-client-dev:6 # {"$imagepolicy": "flux-system:fundhub-client-dev"}
          resources:
            limits:
              memory: "256Mi"
              cpu: "100m"
            requests:
              memory: "128Mi"
              cpu: "10m"
          ports:
            - containerPort: 3000
          env:
            - name: BASE_URL
              value: http://localhost:8000
              # value: http://fundhub-api-dev-svc.backend.svc.cluster.local # Ini masih belum berhasil connect ke backend service
            - name: PORT
              value: "3000"
