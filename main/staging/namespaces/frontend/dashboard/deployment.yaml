apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundhub-dashboard-dev
spec:
  selector:
    matchLabels:
      app: fundhub-dashboard-dev
  template:
    metadata:
      labels:
        app: fundhub-dashboard-dev
    spec:
      containers:
        - name: fundhub-dashboard-dev
          image: titan29/fundhub-dashboard-dev:1
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "68Mi"
              cpu: "10m"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fundhub-dashboard-config
