apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - namespace.yaml
  - configs/
  - kube-prometheus-stack/
  - loki-stack/
  - ../../../../helm/grafana/helm-repository.yaml
  - ../../../../helm/prometheus-community/helm-repository.yaml

configMapGenerator:
  - name: flux-grafana-dashboards
    files:
      - ./main/staging/namespaces/monitoring/configs/dashboards/control-plane.json
      - ./main/staging/namespaces/monitoring/configs/dashboards/cluster.json
      - ./main/staging/namespaces/monitoring/configs/dashboards/logs.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: flux
        app.kubernetes.io/component: monitoring
  - name: flux-kube-state-metrics-config
    files:
      - ./main/staging/namespaces/monitoring/kube-prometheus-stack/kube-state-metrics-config.yaml
configurations:
  - ./main/staging/namespaces/monitoring/kube-prometheus-stack/kustomizeconfig.yaml
